spring.application.name=Secretaria de Transporte

# Banco de dados
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_BANCO}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# Tratamento de erros
server.error.include-stacktrace=never

# JWT
api.security.token.secret=${JWT_SECRETS}
api.security.token.assinatura=${JWT_ASSINATURA}

# CORS
api.security.origenspermitidas=${API_CORS_ORIGINS}

# Contexto da API
server.servlet.context-path=/api