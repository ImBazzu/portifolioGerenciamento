<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/head :: head('Erro')}"></head>

<body>
    <main class="app-error-page">
        <section class="card app-error-card text-center">
            <div class="card-body p-4 p-md-5">
                <i class="bi bi-exclamation-circle text-warning fs-1" aria-hidden="true"></i>
                <h1 class="h3 fw-bold mt-3">Não foi possível concluir</h1>
                <p class="text-muted mb-4">Ocorreu um erro ao processar sua solicitação.</p>
                <a th:href="@{/veiculo}" class="btn btn-primary">
                    <i class="bi bi-arrow-left me-1"></i> Voltar ao início
                </a>
            </div>
        </section>
    </main>
</body>

</html>
