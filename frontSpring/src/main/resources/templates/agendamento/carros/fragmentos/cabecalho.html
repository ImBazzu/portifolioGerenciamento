<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="cabecalho">
            <!-- CABEÇALHO DA PÁGINA -->
            <header class="app-page-header bg-white shadow-sm p-4 rounded-4 mb-4 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <h1 class="h3 fw-bold text-dark mb-1">Passageiros de carros</h1>
                    <p class="text-muted mb-0">Organize manualmente ou automaticamente os passageiros de carro e de outras categorias pendentes.</p>
                </div>
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <a class="btn btn-outline-secondary btn-sm" th:href="@{/agendamentos(data=${data})}">
                        <i class="bi bi-arrow-left me-1"></i>Voltar à agenda
                    </a>
                    <a class="btn btn-outline-primary btn-sm" th:href="@{/agendamentos/pdf/carros(data=${data})}"
                       target="_blank">
                        <i class="bi bi-file-earmark-pdf me-1"></i>PDF único de carros
                    </a>
                </div>
            </header>
</th:block>
