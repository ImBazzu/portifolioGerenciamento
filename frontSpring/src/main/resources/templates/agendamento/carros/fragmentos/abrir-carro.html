<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="abrirCarro">
                <div class="modal fade" id="abrirCarroModal" tabindex="-1" aria-labelledby="abrirCarroTitulo" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content border-0 shadow">
                        <form method="post" th:action="@{/agendamentos/carros/veiculos}"
                              th:attr="data-carro-disponivel=${carroQuatroLugares != null}">
                            <div class="modal-header">
                                <h2 class="modal-title fs-5" id="abrirCarroTitulo">Abrir carro</h2>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                            </div>
                            <div class="modal-body">
                            <p class="text-muted">Escolha o motivo. Para emergência e alta, informe a saída do veículo.</p>
                            <input type="hidden" name="data" th:value="${data}">
                            <input th:if="${carroQuatroLugares != null}" type="hidden" name="idTipoVeiculo"
                                   th:value="${carroQuatroLugares.id()}">
                            <input type="hidden" name="idListaAbertura">
                            <span th:each="lista : ${listas}" th:if="${lista.finalidadeEspecial() != null}"
                                  th:attr="data-lista-finalidade=${lista.finalidadeEspecial()},data-lista-id=${lista.id()}" hidden></span>
                            <div class="mb-3">
                                <label class="form-label fw-semibold" for="finalidadeAberturaCarro">Motivo da abertura</label>
                                <select class="form-select" id="finalidadeAberturaCarro" name="finalidadeAbertura"
                                        data-finalidade-abertura>
                                    <option value="AJUSTE">Ajuste ou separação de passageiros</option>
                                    <option value="EMERGENCIA">Emergência do postão</option>
                                    <option value="ALTA">Alta hospitalar</option>
                                </select>
                            </div>
                            <div class="mb-3" data-finalidade-horario hidden>
                                <label class="form-label fw-semibold" for="horarioSaidaCarro">Saída do veículo</label>
                                <input class="form-control" type="time" id="horarioSaidaCarro" name="horarioSaida">
                            </div>
                            <div class="text-danger" data-finalidade-lista-status role="alert" hidden></div>
                            </div>
                            <div class="modal-footer">
                                <button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
                                <button class="btn btn-primary" type="submit" data-abrir-carro
                                        th:disabled="${carroQuatroLugares == null}">
                                    <i class="bi bi-plus-lg me-1"></i>Abrir carro
                                </button>
                            </div>
                        </form>
                        </div>
                    </div>
                </div>
</th:block>
