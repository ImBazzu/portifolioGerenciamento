<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="abrirCarro">
                <section class="card border-0 shadow-sm mb-4 rounded-4">
                    <div class="card-body d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 p-4">
                        <div>
                            <h2 class="h5 mb-1 fw-bold text-dark">Abrir carro</h2>
                            <p class="text-muted mb-0">Registre um carro para atribuir passageiros desta agenda.</p>
                        </div>
                        <button class="btn btn-primary shadow-sm" type="button"
                                data-bs-toggle="modal" data-bs-target="#abrirCarroModal"
                                th:disabled="${#lists.isEmpty(tiposVeiculoCarro)}">
                            <i class="bi bi-plus-lg me-1"></i>Abrir carro
                        </button>
                    </div>
                </section>

                <!-- MODAL ABRIR CARRO -->
                <div class="modal fade" id="abrirCarroModal" tabindex="-1" aria-labelledby="abrirCarroTitulo" aria-hidden="true">
                    <div class="modal-dialog">
                        <div class="modal-content border-0 shadow">
                            <form method="post" th:action="@{/agendamentos/carros/veiculos}">
                                <input type="hidden" name="data" th:value="${data}">
                                <div class="modal-header bg-primary text-white">
                                    <h2 class="modal-title fs-5" id="abrirCarroTitulo">Abrir carro</h2>
                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold" for="tipoCarro">Tipo de carro</label>
                                        <select class="form-select" name="idTipoVeiculo" id="tipoCarro" required>
                                            <option value="">Selecione</option>
                                            <option th:each="tipo : ${tiposVeiculoCarro}" th:value="${tipo.id()}"
                                                    th:text="${tipo.nome() + ' — ' + tipo.capacidade() + ' lugares'}">
                                            </option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="form-label fw-semibold" for="identificacaoCarro">Identificação</label>
                                        <input class="form-control" id="identificacaoCarro" name="identificacao"
                                               maxlength="80" placeholder="Ex.: carro 01">
                                    </div>
                                </div>
                                <div class="modal-footer bg-light">
                                    <button class="btn btn-secondary btn-sm" type="button" data-bs-dismiss="modal">Cancelar</button>
                                    <button class="btn btn-primary btn-sm" type="submit">
                                        <i class="bi bi-plus-lg me-1"></i>Abrir carro
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
</th:block>
