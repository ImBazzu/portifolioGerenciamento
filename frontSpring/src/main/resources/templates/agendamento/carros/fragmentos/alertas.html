<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="alertas">
            <div th:if="${erro}" class="alert alert-danger shadow-sm" role="alert" th:text="${erro}"></div>
            <div th:if="${sucesso}" class="alert alert-success shadow-sm" role="alert" th:text="${sucesso}"></div>

            <section th:if="${agenda == null}" class="alert alert-info shadow-sm">
                Não há agenda aberta para <span th:text="${#temporals.format(data, 'dd/MM/yyyy')}"></span>.
            </section>
</th:block>
