<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="modaisInsercao">
                <!-- MODAL DE INSERÇÃO DIRETA (EXIBE TODOS OS PASSAGEIROS PENDENTES DA AGENDA) -->
                <th:block th:each="veiculo : ${veiculosCarro}">
                    <div class="modal fade" th:id="'atribuirPassageiroCarroModal-' + ${veiculo.id()}" tabindex="-1" aria-hidden="true">
                        <div class="modal-dialog modal-lg">
                            <div class="modal-content border-0 shadow">
                                <form method="post" th:action="@{/agendamentos/atribuir-direto}">
                                    <input type="hidden" name="data" th:value="${data}">
                                    <input type="hidden" name="idVeiculo" th:value="${veiculo.id()}">
                                    <input type="hidden" name="paginaCarros" value="true">
                                    <div class="modal-header bg-light">
                                        <h2 class="modal-title fs-5" th:text="'Inserir em: ' + (${veiculo.identificacao() != null ? veiculo.identificacao() : veiculo.nomeTipoVeiculo()})"></h2>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                                    </div>
                                    <div class="modal-body">
                                        <label class="form-label fw-semibold" th:for="'buscaPassageiroInput-' + ${veiculo.id()}">
                                            Filtrar passageiro pendente
                                        </label>
                                        <input type="search" class="form-control mb-2 busca-passageiro-input"
                                            th:id="'buscaPassageiroInput-' + ${veiculo.id()}"
                                            placeholder="Digite o nome, cidade ou destino..."
                                            autocomplete="off">

                                        <div class="list-group border rounded-3 overflow-auto" style="max-height: 320px;">
                                            <label class="list-group-item list-group-item-action item-passageiro py-2 d-flex justify-content-between align-items-center"
                                                th:each="p : ${passageirosPendentesPorVeiculo.get(veiculo.id())}"
                                                th:data-busca="${detalhesPassageiros.get(p.idPessoa()).nome() + ' ' + detalhesPassageiros.get(p.idPessoa()).cidade() + ' ' + detalhesPassageiros.get(p.idPessoa()).destino()}">
                                                <div>
                                                    <input class="form-check-input me-2" type="radio" name="idAgendamento"
                                                        th:value="${p.id()}" th:checked="${pessoaParaInsercao != null and p.idPessoa() == pessoaParaInsercao}" required>
                                                    <strong th:text="${detalhesPassageiros.get(p.idPessoa()).nome()}"></strong>
                                                    <span class="text-muted small"
                                                        th:text="${' · ' + detalhesPassageiros.get(p.idPessoa()).cidade() + ' · ' + p.acompanhantes() + ' acomp.'}"></span>
                                                </div>
                                                <span th:each="t : ${tiposVeiculo}"
                                                      th:if="${t.id() == p.idTipoVeiculo()}"
                                                      class="badge bg-light text-secondary border"
                                                      th:text="${t.nome()}"></span>
                                            </label>
                                        </div>

                                        <div th:if="${#lists.isEmpty(passageirosPendentesPorVeiculo.get(veiculo.id()))}"
                                             class="text-muted small mt-2">
                                            Nenhum passageiro pendente para este carro.
                                        </div>
                                        <div class="text-muted small mt-2 d-none sem-resultados">
                                            Nenhum passageiro pendente encontrado.
                                        </div>
                                        <a th:if="${veiculo.finalidadeAbertura().name() == 'AJUSTE'}"
                                           class="btn btn-sm btn-outline-primary mt-3"
                                           th:href="@{/agendamentos(data=${data}, novoPassageiro=true, veiculoOrigem=${veiculo.id()}, origemCarros=true)}">
                                            <i class="bi bi-person-plus me-1"></i>Cadastrar passageiro
                                        </a>
                                        <a th:if="${veiculo.finalidadeAbertura().name() != 'AJUSTE' and veiculo.idListaAbertura() != null}"
                                           class="btn btn-sm btn-outline-primary mt-3"
                                           th:href="@{/agendamentos(data=${data}, novoPassageiro=true, veiculoOrigem=${veiculo.id()}, origemCarros=true, idLista=${veiculo.idListaAbertura()}, horarioSaidaVeiculo=${veiculo.horarioSaida()}, informarHorarioSaida=true)}">
                                            <i class="bi bi-person-plus me-1"></i>Cadastrar passageiro
                                        </a>
                                    </div>
                                    <div class="modal-footer bg-light">
                                        <button class="btn btn-secondary btn-sm" type="button" data-bs-dismiss="modal">Cancelar</button>
                                        <button class="btn btn-primary btn-sm js-atribuir-passageiro" type="submit"
                                                th:disabled="${#lists.isEmpty(passageirosPendentesPorVeiculo.get(veiculo.id()))}">Atribuir ao carro</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </th:block>
</th:block>
