<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="resumoAgenda">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4">
                    <div>
                        <h2 class="h5 fw-bold text-dark mb-1">Agenda de <span th:text="${#temporals.format(data, 'dd/MM/yyyy')}"></span></h2>
                        <span class="text-muted small"
                              th:text="${passageirosPendentesCarro.size() + ' passageiro(s) de carro aguardando separação'}"></span>
                    </div>
                    <form method="post"
                          th:action="@{/agendamentos/dias/{data}/separacao-automatica(data=${data})}"
                          onsubmit="return confirm('Separar automaticamente somente os passageiros de carro?')">
                        <button class="btn btn-warning shadow-sm fw-semibold" type="submit"
                                th:disabled="${#lists.isEmpty(passageirosPendentesCarro)}">
                            <i class="bi bi-diagram-3 me-1"></i>Separar carros automaticamente
                        </button>
                    </form>
                </div>

                <section th:if="${pendencias != null and !#lists.isEmpty(pendencias)}" class="alert alert-warning shadow-sm">
                    <strong>Passageiros que permaneceram pendentes:</strong>
                    <ul class="mb-0 mt-2 small">
                        <li th:each="pendencia : ${pendencias}"
                            th:text="${pendencia.idAgendamento() + ' — ' + pendencia.motivo()}"></li>
                    </ul>
                </section>
</th:block>
