<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/head :: head('Passageiros de carros')}"></head>

<body class="bg-light">
<div class="d-flex min-vh-100">
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>

    <main th:replace="~{layout/principal :: principal(~{::conteudo})}">
        <div th:fragment="conteudo" class="app-page">

            <th:block th:replace="~{agendamento/carros/fragmentos/cabecalho :: cabecalho}"></th:block>
            <th:block th:replace="~{agendamento/carros/fragmentos/alertas :: alertas}"></th:block>

            <th:block th:if="${agenda != null}">
                <th:block th:replace="~{agendamento/carros/fragmentos/resumo-agenda :: resumoAgenda}"></th:block>
                <th:block th:replace="~{agendamento/carros/fragmentos/abrir-carro :: abrirCarro}"></th:block>
                <th:block th:replace="~{agendamento/carros/fragmentos/passageiros-pendentes :: passageirosPendentes}"></th:block>
                <th:block th:replace="~{agendamento/carros/fragmentos/modais-exclusao :: modaisExclusao}"></th:block>
                <th:block th:replace="~{agendamento/carros/fragmentos/carros-atribuidos :: carrosAtribuidos}"></th:block>
                <th:block th:replace="~{agendamento/carros/fragmentos/modais-insercao :: modaisInsercao}"></th:block>
                <span th:if="${veiculoParaInsercao != null}" id="abrirInsercaoAposCriacao"
                      th:attr="data-modal-id='atribuirPassageiroCarroModal-' + ${veiculoParaInsercao}" hidden></span>
            </th:block>

        </div>
    </main>
</div>

<script th:src="@{/js/agendamento-edicao.js}" defer></script>
</body>
</html>
