<th:block th:fragment="tabelaPassageiros" xmlns:th="http://www.thymeleaf.org">

                <!-- TABELA DE PASSAGEIROS CADASTRADOS (SEM A TROCA RÁPIDA) -->

                <section class="card border-0 shadow-sm mt-4 rounded-4 overflow-hidden">

                    <div class="card-header bg-white py-3 border-0">

                        <div class="row g-2 align-items-center">

                            <div class="col-12">

                                <h2 class="h5 mb-0 fw-bold text-dark">Passageiros Cadastrados</h2>

                            </div>

                            <div class="col-12">

                                <div class="row g-2">

                                    <div class="col-12 col-md-4">

                                        <input type="text" id="filtroTexto" class="form-control form-control-sm" aria-label="Buscar passageiros" placeholder="Nome, telefone, CPF, destino, lista ou especificação">

                                    </div>

                                    <div class="col-12 col-sm-6 col-md-2">

                                        <input type="text" id="filtroCidade" class="form-control form-control-sm" placeholder="Filtrar por cidade...">

                                    </div>

                                    <div class="col-12 col-sm-6 col-md-2">

                                        <select id="filtroStatus" class="form-select form-select-sm">

                                            <option value="">Todos os status</option>

                                            <option value="pendente">Somente Pendentes</option>

                                            <option value="atribuido">Somente Atribuídos</option>

                                        </select>

                                    </div>

                                    <div class="col-12 col-sm-6 col-md-2">
                                        <select id="filtroTipoVeiculo" class="form-select form-select-sm" aria-label="Filtrar por tipo de veículo">
                                            <option value="">Todos os tipos de veículo</option>
                                        </select>
                                    </div>
                                    <div class="col-12 col-sm-6 col-md-2">
                                        <select id="filtroResidencia" class="form-select form-select-sm" aria-label="Filtrar por busca na residência">
                                            <option value="">Todas as buscas</option>
                                            <option value="true">Busca na residência</option>
                                            <option value="false">Sem busca na residência</option>
                                        </select>
                                    </div>
                                    <div class="col-12 col-sm-6 col-md-3">
                                        <select id="ordenacaoPassageiros" class="form-select form-select-sm" aria-label="Ordenar passageiros por">
                                            <option value="">Ordem original</option>
                                            <option value="nome">Nome</option>
                                            <option value="cidade">Cidade</option>
                                            <option value="chegada">Horário de chegada</option>
                                            <option value="saida">Horário de saída</option>
                                            <option value="tipoNome">Tipo de veículo</option>
                                        </select>
                                    </div>
                                    <div class="col-12 col-sm-6 col-md-2">
                                        <select id="direcaoOrdenacao" class="form-select form-select-sm" aria-label="Direção da ordenação">
                                            <option value="asc">Crescente</option>
                                            <option value="desc">Decrescente</option>
                                        </select>
                                    </div>
                                    <div class="col-6 col-md-2">

                                        <button type="button" id="btnLimparFiltros" class="btn btn-sm btn-outline-secondary w-100">Limpar</button>

                                    </div>

                                </div>

                            </div>

                        </div>
                        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3">
                            <span id="contagemPassageiros" class="small text-muted" aria-live="polite"></span>
                            <form id="formPdfPassageiros" th:action="@{/agendamentos/pdf/passageiros}" method="post" target="_blank">
                                <input type="hidden" name="data" th:value="${data}">
                                <span id="idsPdfPassageiros"></span>
                                <button type="submit" id="btnPdfPassageiros" class="btn btn-sm btn-outline-primary" disabled>
                                    <i class="bi bi-file-earmark-pdf me-1"></i>PDF dos resultados
                                </button>
                            </form>
                        </div>

                    </div>



                    <div th:if="${#lists.isEmpty(passageirosCadastrados)}" class="card-body text-muted p-4">

                        Nenhum passageiro cadastrado para esta data.

                    </div>



                    <div th:if="${!#lists.isEmpty(passageirosCadastrados)}" class="table-responsive">

                        <table class="table align-middle mb-0 table-hover" id="tabelaPassageiros">

                            <thead class="table-light">

                            <tr>

                                <th class="py-3">Passageiro / Telefone</th>

                                <th class="py-3">Cidade / Destino</th>

                                <th class="py-3">Horário</th>

                                <th class="py-3">Acomp.</th>

                                <th class="py-3">Lista</th>

                                <th class="py-3">Veículo Atribuído</th>

                                <th class="py-3 text-end">Ações</th>

                            </tr>

                            </thead>

                            <tbody>

                            <tr th:each="passageiro : ${passageirosCadastrados}"

                                class="linha-passageiro"

                                th:data-nome="${detalhesAgendamentos.get(passageiro.id()).nome()}"

                                th:data-telefone="${detalhesAgendamentos.get(passageiro.id()).telefone()}"
                                th:data-cpf="${detalhesAgendamentos.get(passageiro.id()).cpf()}"
                                th:data-especificacao="${detalhesAgendamentos.get(passageiro.id()).especificacao()}"
                                th:data-lista="${nomesListasPassageiros.get(passageiro.idLista())}"
                                th:data-id="${passageiro.id()}"
                                th:data-tipo="${passageiro.idTipoVeiculo()}"
                                th:data-tipo-nome="${nomesTiposPassageiros.get(passageiro.idTipoVeiculo())}"
                                th:data-residencia="${passageiro.buscarNaResidencia()}"
                                th:data-chegada="${passageiro.horarioChegada()}"
                                th:data-saida="${passageiro.idVeiculoAberto() != null and veiculoAtribuido.get(passageiro.id()) != null ? veiculoAtribuido.get(passageiro.id()).horarioSaida() : ''}"

                                th:data-cidade="${detalhesAgendamentos.get(passageiro.id()).cidade()}"

                                th:data-destino="${detalhesAgendamentos.get(passageiro.id()).destino()}"

                                th:data-status="${passageiro.idVeiculoAberto() == null ? 'pendente' : 'atribuido'}">

                                <td>

                                    <strong class="text-dark" th:text="${detalhesAgendamentos.get(passageiro.id()).nome()}"></strong>

                                    <div class="small text-muted" th:text="${detalhesAgendamentos.get(passageiro.id()).telefone()}"></div>

                                </td>

                                <td>

                                    <span class="text-dark" th:text="${detalhesAgendamentos.get(passageiro.id()).cidade()}"></span>

                                    <div class="small text-muted" th:text="${detalhesAgendamentos.get(passageiro.id()).destino()}"></div>

                                </td>

                                <td th:text="${passageiro.horarioChegada()}"></td>

                                <td>

                                    <span class="badge bg-light text-dark border px-2 py-1" th:text="${passageiro.acompanhantes()}"></span>

                                </td>

                                <td>

                                    <span class="text-secondary fw-semibold"
                                          th:text="${nomesListasPassageiros.get(passageiro.idLista())}">

                                    </span>

                                </td>

                                <td>

                                    <span th:if="${passageiro.idVeiculoAberto() == null}" class="badge bg-warning text-dark">

                                        <i class="bi bi-clock me-1"></i>Pendente

                                    </span>

                                    <th:block th:unless="${passageiro.idVeiculoAberto() == null}"

                                            th:with="veiculo=${veiculoAtribuido.get(passageiro.id())}">

                                        <span class="badge bg-success">

                                            <i class="bi bi-truck me-1"></i>

                                            <span th:text="${veiculo.nome()}"></span>

                                        </span>

                                        <div class="small text-muted mt-1">

                                            Saída:

                                            <strong th:text="${veiculo.horarioSaida() != null

                                                    ? #temporals.format(veiculo.horarioSaida(), 'HH:mm')

                                                    : 'A definir'}"></strong>

                                        </div>

                                    </th:block>

                                </td>

                                <td class="text-end">

                                    <div class="d-flex justify-content-end gap-2">

                                        <button type="button"

                                                class="btn btn-sm btn-outline-primary"

                                                data-bs-toggle="modal"

                                                th:attr="data-bs-target='#editarAgendamentoModal-' + ${passageiro.id()}">

                                            <i class="bi bi-pencil-square me-1"></i>Detalhes

                                        </button>

                                    </div>

                                    <div th:replace="~{agendamento/modalEditar :: modal(${passageiro}, ${data}, ${tiposVeiculo}, ${agenda.veiculos()}, false)}"></div>

                                </td>

                            </tr>

                            <tr id="semResultadosFiltro" class="d-none">

                                <td colspan="7" class="text-center py-4 text-muted">

                                    Nenhum passageiro encontrado com os filtros aplicados.

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </section>

</th:block>
