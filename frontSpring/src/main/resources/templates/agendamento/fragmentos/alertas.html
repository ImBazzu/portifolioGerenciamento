<th:block th:fragment="alertas" xmlns:th="http://www.thymeleaf.org">
            <!-- ALERTAS -->
            <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
                <i class="bi bi-check-circle me-2"></i><span th:text="${sucesso}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
            </div>
            <div th:if="${erro}" class="alert alert-danger shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${erro}"></span>
            </div>
            <div th:if="${erroVerificacao}" class="alert alert-warning shadow-sm" role="alert">
                <i class="bi bi-exclamation-triangle me-2"></i><span th:text="${erroVerificacao}"></span>
            </div>
</th:block>
