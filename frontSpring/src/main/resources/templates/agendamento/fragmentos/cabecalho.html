<th:block th:fragment="cabecalho" xmlns:th="http://www.thymeleaf.org">
            <!-- CABEÇALHO DA PÁGINA (Exibido apenas quando há uma data selecionada na URL) -->
            <header th:if="${param.data != null and !#strings.isEmpty(param.data[0])}"
                    class="app-page-header bg-white shadow-sm p-4 rounded-4 mb-4 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <div class="d-flex align-items-center gap-2 mb-1">
                        <h1 class="h3 fw-bold text-dark mb-0">Agendamentos</h1>
                        <span class="badge bg-primary bg-opacity-10 text-primary border border-primary-subtle fs-6 px-3 py-1 rounded-pill"
                              th:if="${data != null}">
                            <i class="bi bi-calendar-event me-1"></i>
                            <span th:text="${#temporals.format(data, 'dd/MM/yyyy')}"></span>
                        </span>
                    </div>
                    <p class="text-muted mb-0">Abra os veículos do dia, agende passageiros e organize a separação.</p>
                </div>
                
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <a class="btn btn-outline-secondary shadow-sm fw-semibold" th:href="@{/agendamentos}">
                        <i class="bi bi-arrow-left me-1"></i>Voltar / Trocar data
                    </a>
                </div>
            </header>
</th:block>
