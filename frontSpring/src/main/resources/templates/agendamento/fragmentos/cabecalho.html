<th:block th:fragment="cabecalho" xmlns:th="http://www.thymeleaf.org">
            <!-- CABEÇALHO DA PÁGINA -->
            <header class="app-page-header bg-white shadow-sm p-4 rounded-4 mb-4 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                <div>
                    <h1 class="h3 fw-bold text-dark mb-1">Agendamentos</h1>
                    <p class="text-muted mb-0">Abra os veículos do dia, agende passageiros e organize a separação.</p>
                </div>
                
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <form method="get" th:action="@{/agendamentos}" class="d-flex align-items-center gap-2 bg-light p-2 rounded-3 border">
                        <label for="dataTopo" class="form-label text-secondary small mb-0 fw-semibold">Data:</label>
                        <input class="form-control form-control-sm" type="date" id="dataTopo" name="data" th:value="${data}" required>
                    </form>
                </div>
            </header>

            <!-- MODAL CONSULTAR DIA -->
            <div class="modal fade" id="consultarDiaModal" tabindex="-1" aria-labelledby="consultarDiaTitulo" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content border-0 shadow">
                        <form method="get" th:action="@{/agendamentos}">
                            <div class="modal-header bg-primary text-white">
                                <h2 class="modal-title fs-5" id="consultarDiaTitulo">Consultar agenda</h2>
                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
                            </div>
                            <div class="modal-body">
                                <label class="form-label fw-semibold" for="dataAgenda">Dia da agenda</label>
                                <input class="form-control" type="date" id="dataAgenda" name="data" th:value="${data}" required>
                            </div>
                            <div class="modal-footer bg-light">
                                <button class="btn btn-secondary btn-sm" type="button" data-bs-dismiss="modal">Cancelar</button>
                                <button class="btn btn-primary btn-sm" type="submit">Consultar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
</th:block>
