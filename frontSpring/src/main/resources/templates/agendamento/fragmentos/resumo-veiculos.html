<th:block th:fragment="resumoVeiculos" xmlns:th="http://www.thymeleaf.org">

                <!-- RESUMO DOS VEÍCULOS -->
                <section class="mb-4">
                    <h2 class="h5 mb-3 fw-bold text-dark">Resumo dos Veículos do Dia</h2>
                    <div th:if="${#lists.isEmpty(agenda.veiculos())}" class="alert alert-info shadow-sm">
                        Nenhum veículo aberto para esta data.
                    </div>
                    <div class="row g-3" th:if="${!#lists.isEmpty(agenda.veiculos())}">
                        
                        <!-- CARD VEÍCULOS NORMAIS -->
                        <div class="col-12 col-sm-6 col-md-4 col-xl-3" th:each="veiculo : ${veiculosNaoCarro}">

                            <th:block th:replace="~{
                                    agendamento/controlesVeiculo ::
                                    modalExcluir(${veiculo}, ${data}, false)
                                }"></th:block>

                            <div class="card border-0 shadow-sm h-100 rounded-4">
                                <div class="card-body d-flex flex-column justify-content-between p-4">
                                    <div>
                                        <div class="d-flex justify-content-between align-items-start mb-2">
                                            <h3 class="h6 mb-0 text-primary fw-bold" th:text="${veiculo.nomeTipoVeiculo()}"></h3>
                                            <span class="badge bg-light text-dark border"
                                                  th:text="${veiculo.identificacao() != null ? veiculo.identificacao() : 'S/ ID'}"></span>
                                        </div>

                                        <div class="mt-3">
                                            <div class="d-flex justify-content-between align-items-center mb-1">
                                                <small class="text-muted">Ocupação:</small>
                                                <span class="fw-bold small" th:text="${veiculo.assentosOcupados() + ' / ' + veiculo.capacidade() + ' vagas'}"></span>
                                            </div>
                                            <div class="progress rounded-pill" style="height: 6px;">
                                                <div class="progress-bar rounded-pill" role="progressbar"
                                                     th:style="'width: ' + (${veiculo.capacidade() > 0 ? (veiculo.assentosOcupados() * 100 / veiculo.capacidade()) : 0}) + '%'"
                                                     th:classappend="${veiculo.assentosOcupados() >= veiculo.capacidade() ? 'bg-danger' : 'bg-success'}"></div>
                                            </div>
                                        </div>

                                        <div class="mt-3 pt-2 border-top d-flex justify-content-between align-items-center small text-muted">
                                            <span>Saída:</span>
                                            <strong th:text="${veiculo.horarioSaida() != null ? veiculo.horarioSaida() : 'A definir'}"></strong>
                                        </div>
                                    </div>

                                    <div class="mt-3 pt-2 border-top d-flex flex-wrap gap-2">
                                        <a class="btn btn-sm btn-outline-secondary flex-fill"
                                           th:href="@{/agendamentos/pdf/veiculos/{id}(id=${veiculo.id()}, data=${data})}"
                                           target="_blank">
                                            <i class="bi bi-file-earmark-pdf me-1"></i>PDF
                                        </a>
                                        <button class="btn btn-sm btn-outline-primary flex-fill" type="button"
                                                data-bs-toggle="modal"
                                                th:attr="data-bs-target='#atribuirPassageiroModal-' + ${veiculo.id()}">
                                            <i class="bi bi-person-plus me-1"></i>Inserir
                                        </button>
                                        <button class="btn btn-sm btn-outline-danger flex-fill" type="button"
                                                data-bs-toggle="modal"
                                                th:attr="data-bs-target='#excluirVeiculoModal-' + ${veiculo.id()}">
                                            <i class="bi bi-trash me-1"></i>Excluir
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- CARD CARROS -->
                        <div class="col-12 col-sm-6 col-md-4 col-xl-3" th:if="${!#lists.isEmpty(veiculosCarro)}">
                            <div class="card border-0 shadow-sm h-100 bg-white rounded-4 border-start border-success border-4">
                                <div class="card-body d-flex flex-column justify-content-between p-4">
                                    <div>
                                        <div class="d-flex justify-content-between align-items-start mb-2">
                                            <h3 class="h6 mb-0 text-success fw-bold">Carros (Total)</h3>
                                            <span class="badge bg-success text-white" 
                                                  th:text="${veiculosCarro.size() + ' carro(s)'}"></span>
                                        </div>

                                        <div class="mt-3">
                                            <div class="d-flex justify-content-between align-items-center mb-1">
                                                <small class="text-muted">Passageiros acomodados:</small>
                                                <span class="fw-bold small" th:text="${#aggregates.sum(veiculosCarro.![assentosOcupados()]) + ' / ' + #aggregates.sum(veiculosCarro.![capacidade()]) + ' vagas'}"></span>
                                            </div>
                                            <div class="progress rounded-pill" style="height: 6px;">
                                                <div class="progress-bar bg-success rounded-pill" role="progressbar" th:style="'width: 100%'"></div>
                                            </div>
                                        </div>

                                        <div class="mt-3 pt-2 border-top small text-muted">
                                            <span>Gerencie as atribuições individuais na página específica.</span>
                                        </div>
                                    </div>

                                    <div class="mt-3 pt-2 border-top d-flex gap-2">
                                        <a class="btn btn-sm btn-outline-primary w-50"
                                           th:href="@{/agendamentos/carros(data=${data})}">
                                            <i class="bi bi-car-front me-1"></i>Carros
                                        </a>
                                        <a class="btn btn-sm btn-success w-50 shadow-sm"
                                           th:href="@{/agendamentos/pdf/carros(data=${data})}"
                                           target="_blank">
                                            <i class="bi bi-file-earmark-pdf me-1"></i>PDF
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

    
</th:block>
