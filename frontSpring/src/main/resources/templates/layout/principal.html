<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<body>

<main th:fragment="principal(conteudo)" class="flex-grow-1 bg-light">

    <!-- Indicador Global de Carregamento HTMX (Bloqueia a tela e previne duplo clique) -->
    <div id="global-loader" class="htmx-indicator">
        <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Carregando...</span>
        </div>
    </div>

    <!-- Barra Superior Mobile -->
    <header class="mobile-header">
        <div class="fw-bold fs-5">
            <img th:src="@{/images/logo.png}" alt="Prefeitura" class="img-fluid" style="max-height: 65px;">
        </div>
        <button class="btn-toggle-sidebar" id="btnToggleSidebar" aria-label="Abrir Menu">
            <i class="bi bi-list"></i>
        </button>
    </header>

    <!-- Overlay para fechar ao clicar fora (Sidebar Mobile) -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Conteúdo Principal Dinâmico (HTMX) -->
    <div id="conteudo-principal" class="container-fluid px-3 px-md-4 py-3 py-md-4">
        <th:block th:replace="${conteudo}"></th:block>
    </div>

    <!-- Container Global Único para Modais Puros em CSS (Injetado via HTMX) -->
    <div id="modal"></div>

    <script src="https://unpkg.com/htmx.org@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/base.js}"></script>
</main>

</body>

</html>
