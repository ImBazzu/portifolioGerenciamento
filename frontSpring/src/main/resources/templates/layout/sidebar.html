<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<body>
<aside th:fragment="sidebar" class="sidebar d-flex flex-column p-3 text-white">

    <!-- CABEÇALHO DA SIDEBAR COM BOTÃO DE FECHAR (MOBILE) -->
    <div class="d-flex justify-content-between align-items-center mb-3 d-lg-none">
        <span class="fw-bold fs-6 text-white-50">MENU</span>
        <button type="button" class="btn-close btn-close-white" id="btnFecharSidebar" aria-label="Fechar Menu"></button>
    </div>

    <!-- LOGO -->
    <div class="text-center mb-3">
        <div class="sidebar-brand-box">
            <img th:src="@{/images/logo.png}" alt="Prefeitura" class="img-fluid" style="max-height: 65px;">
        </div>
    </div>

    <!-- IDENTIFICAÇÃO -->
    <div class="mb-3 px-2">
        <div class="fw-bold fs-5 text-white">Sec. de Transporte</div>
        <small class="text-white-50"><i class="bi bi-shield-check me-1"></i>Gestão Operacional</small>
    </div>

    <!-- MENU DE NAVEGAÇÃO -->
    <nav class="nav nav-pills flex-column gap-1" id="sidebar-menu">
        <a href="/" class="nav-link text-white" th:classappend="${pagina == '/' ? 'active' : ''}">
            <i class="bi bi-calendar3"></i> Agendamentos
        </a>
        <a href="/cidade" class="nav-link text-white" th:classappend="${pagina == 'cidades' ? 'active' : ''}">
            <i class="bi bi-geo-alt"></i> Cidade e Destino
        </a>
        <a href="/pessoas" class="nav-link text-white" th:classappend="${pagina == 'pessoas' ? 'active' : ''}">
            <i class="bi bi-person"></i> Pessoas
        </a>
        <a href="/listas" class="nav-link text-white" th:classappend="${pagina == 'listas' ? 'active' : ''}">
            <i class="bi bi-list-ul"></i> Listas
        </a>
        <a href="/veiculo" class="nav-link text-white" th:classappend="${pagina == 'veiculos' ? 'active' : ''}">
            <i class="bi bi-bus-front"></i>Tipos de Veículos
        </a>
        <a href="/condicoes" class="nav-link text-white" th:classappend="${pagina == 'condicoes' ? 'active' : ''}">
            <i class="bi bi-shield-exclamation"></i> Condições
        </a>
        <a href="/configuracao" class="nav-link text-white" th:classappend="${pagina == '/configuracao' ? 'active' : ''}">
            <i class="bi bi-gear"></i> Configuração
        </a>
    </nav>

    <div class="flex-grow-1"></div>

    <!-- USUÁRIO -->
    <div class="border-top border-secondary pt-3 mt-3 px-2">
        <div class="d-flex align-items-center mb-3">
            <div class="bg-secondary rounded-circle d-flex justify-content-center align-items-center me-2" style="width: 35px; height: 35px;">
                <i class="bi bi-person-fill text-white"></i>
            </div>
            <div>
                <div class="small fw-bold text-white lh-1">Administrador</div>
                <div class="small text-white-50" style="font-size: 0.75rem;">Online</div>
            </div>
        </div>
        <button type="button" class="btn btn-outline-light btn-sm w-100 rounded-3">
            <i class="bi bi-box-arrow-right me-2"></i> Sair
        </button>
    </div>

</aside>
</body>

</html>
