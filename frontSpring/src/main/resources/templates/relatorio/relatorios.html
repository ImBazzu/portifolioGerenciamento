<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/head :: head('Relatórios')}"></head>

<body class="bg-light">
<div class="d-flex min-vh-100">
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>

    <main th:replace="~{layout/principal :: principal(~{::conteudo})}">
        <div th:fragment="conteudo" class="app-page relatorios" th:attr="data-api-relatorios=@{/api/relatorios}">
            <link rel="stylesheet" th:href="@{/css/relatorios.css}">

            <div class="page-header">
                <div class="container-custom">
                    <h1>📊 Relatórios e Análises</h1>
                    <p>Consulte dados através de filtros avançados e visualize gráficos interativos</p>
                </div>
            </div>

            <div class="container-custom">
                <div id="erroRelatorio" class="alert alert-danger" role="alert" hidden></div>
                <th:block th:replace="~{relatorio/fragmentos/filtros :: filtros}"></th:block>
                <th:block th:replace="~{relatorio/fragmentos/navegacao :: navegacao}"></th:block>
                <th:block th:replace="~{relatorio/fragmentos/agendamentos :: agendamentos}"></th:block>
                <th:block th:replace="~{relatorio/fragmentos/pessoas :: pessoas}"></th:block>
                <th:block th:replace="~{relatorio/fragmentos/veiculos :: veiculos}"></th:block>
                <th:block th:replace="~{relatorio/fragmentos/operacional :: operacional}"></th:block>
            </div>

            <script src="https://cdn.jsdelivr.net/npm/apexcharts@latest/dist/apexcharts.min.js" defer></script>
            <script th:src="@{/js/relatorios.js}" defer></script>
        </div>
    </main>
</div>
</body>
</html>
