<div th:fragment="pessoas" id="pessoas" class="tab-content">
            <div class="metrics-row" id="metricsPessoas">
                <div class="loading"><div class="spinner"></div></div>
            </div>

            <div class="chart-container">
                <div class="chart-title">Pessoas cadastradas por especificação (todos os períodos)</div>
                <div id="chartPessoasEspecificacao" class="grafico-relatorio"></div>
            </div>

            <div class="chart-container">
                <div class="chart-title">Pessoas Mais Frequentes</div>
                <div id="chartPessoasMaisFrequentes" class="grafico-relatorio"></div>
            </div>

            <div class="table-container">

                <table class="data-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Nome</th>
                            <th>Especificação</th>

                        </tr>
                    </thead>
                    <tbody id="tabelaPessoasFrequentes">
                        <tr><td colspan="4" class="text-center p-4">Carregando...</td></tr>

                </table>
