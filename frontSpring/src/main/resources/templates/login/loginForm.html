<div th:fragment="loginFormulario" id="form-login" xmlns:hx="http://www.w3.org/1999/xhtml">

    <form th:action="@{/login}" method="post"
          hx:post="@{/login}"
          hx-disabled-elt="find button[type=submit]"
          autocomplete="off">

        <th:block th:replace="~{fragmentos/componentes :: campoTexto(
            'Usuário',
            'login',
            ${usuario},
            'Digite seu usuário',
            'username',
            false,
            null
        )}"></th:block>

        <th:block th:replace="~{fragmentos/componentes :: campoSenha(
            'Senha',
            'senha',
            'Digite sua senha',
            false,
            null
        )}"></th:block>

        <th:block th:replace="~{fragmentos/componentes :: alertaErro}"></th:block>

        <button type="submit" class="btn btn-primary btn-lg w-100">
            <span class="htmx-indicator spinner-border spinner-border-sm me-2"
                  role="status" aria-hidden="true"></span>
            <i class="bi bi-box-arrow-in-right me-2"></i>
            Entrar no Sistema
        </button>

    </form>
</div>
