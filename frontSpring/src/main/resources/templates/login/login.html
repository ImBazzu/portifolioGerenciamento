<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>


    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Sistema de Gestão de Transporte de Pacientes">

    <title>
        Login • Secretaria Municipal de Transporte
    </title>


    <!-- ===================================================== -->
    <!-- Bootstrap                                             -->
    <!-- ===================================================== -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">


    <!-- ===================================================== -->
    <!-- Bootstrap Icons                                       -->
    <!-- ===================================================== -->

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


</head>

<body class="bg-body-tertiary">

    <!-- ========================================================= -->

    <!-- Página                                                    -->

    <!-- ========================================================= -->

    <main class="min-vh-100 d-flex align-items-center py-5">


        <div class="container">

            <div class="row justify-content-center">

                <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">


                    <!-- ================================================= -->
                    <!-- Card                                                -->
                    <!-- ================================================= -->

                    <div class="card border-0 shadow-lg rounded-4 overflow-hidden">


                        <!-- ================================================= -->
                        <!-- Cabeçalho                                           -->
                        <!-- ================================================= -->

                        <div class="card-body px-4 px-md-5 pt-5 pb-4">


                            <!-- ================================================= -->
                            <!-- Logo                                                -->
                            <!-- ================================================= -->

                            <div class="text-center mb-4">

                                <div class="d-inline-flex
                                       align-items-center
                                       justify-content-center
                                       bg-white
                                       rounded-4
                                       p-3
                                       shadow-sm">

                                    <img th:src="@{/images/logo.png}" alt="Prefeitura de Coronel João Sá"
                                        class="img-fluid" style="max-height: 85px;">

                                </div>

                            </div>


                            <!-- ================================================= -->
                            <!-- Título                                              -->
                            <!-- ================================================= -->

                            <div class="text-center mb-4">

                                <h1 class="h4 fw-bold text-dark mb-2">

                                    Secretaria Municipal de Transporte

                                </h1>

                                <p class="text-body-secondary mb-0">

                                    Sistema de Gestão de Transporte de Pacientes

                                </p>

                            </div>


                            <!-- ================================================= -->
                            <!-- Separador                                           -->
                            <!-- ================================================= -->

                            <div class="d-flex align-items-center gap-3 mb-4">

                                <div class="flex-grow-1 border-top"></div>

                                <i class="bi bi-shield-lock text-body-secondary"></i>

                                <div class="flex-grow-1 border-top"></div>

                            </div>


                            <!-- ================================================= -->
                            <!-- Formulário                                         -->
                            <!-- ================================================= -->

                            <div th:replace="~{login/loginForm :: loginFormulario}">
                            </div>


                        </div>


                        <!-- ================================================= -->
                        <!-- Rodapé                                             -->
                        <!-- ================================================= -->

                        <div class="card-footer
                               bg-body
                               border-0
                               px-4
                               px-md-5
                               pb-4">

                            <hr class="my-3">

                            <div class="text-center">

                                <p class="small text-body-secondary mb-1">

                                    Prefeitura Municipal de Coronel João Sá • Bahia

                                </p>

                                <p class="small text-body-secondary mb-2">

                                    Secretaria Municipal de Transporte

                                </p>

                                <p class="small text-body-tertiary mb-0">

                                    Desenvolvido por Robert Hichert Vieira Nascimento

                                </p>

                            </div>

                        </div>


                    </div>


                    <!-- ================================================= -->
                    <!-- Informação de segurança                           -->
                    <!-- ================================================= -->

                    <div class="text-center mt-4">

                        <small class="text-body-secondary">

                            <i class="bi bi-shield-check me-1"></i>

                            Acesso restrito a usuários autorizados

                        </small>

                    </div>


                </div>

            </div>

        </div>


    </main>

    <!-- ========================================================= -->

    <!-- HTMX                                                     -->

    <!-- ========================================================= -->

    <script src="https://unpkg.com/htmx.org@2.0.8">
    </script>

    <!-- ========================================================= -->

    <!-- Bootstrap JS                                              -->

    <!-- ========================================================= -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYzIY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous">
        </script>

    <!-- ========================================================= -->

    <!-- JavaScript da página                                      -->

    <!-- ========================================================= -->

    <script th:src="@{/js/login.js}">
    </script>

</body>

</html>
