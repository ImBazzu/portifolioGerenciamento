<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:hx="http://www.w3.org/1999/xhtml">

<head th:replace="~{layout/head :: head('Cidades')}"></head>

<body>

<div class="d-flex min-vh-100">

    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>

    <main th:replace="~{layout/principal :: principal(~{::conteudo})}">
        <div th:fragment="conteudo" class="container-fluid py-4">

            <!-- Cabeçalho Principal -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1">Cidade & Destinos</h2>
                    <p class="text-muted small mb-0">Gerencia as cidades e destinos cadastrados</p>
                </div>
                <div class="d-flex gap-2">
                    <!-- Botão Arquivados -->
                    <button class="btn btn-outline-secondary"
                            hx:get="@{/cidade/listarArquivado}"
                            hx-target="#modal"
                            hx-swap="innerHTML">
                        <i class="bi bi-archive me-1"></i> Arquivados
                    </button>

                    <!-- Botão Novo Veículo -->
                    <button class="btn btn-primary"
                            hx:get="@{/cidade/abrirFormulario}"
                            hx-target="#modal"
                            hx-swap="innerHTML">
                        <i class="bi bi-plus-lg me-1"></i> Nova Cidade
                    </button>
                </div>
            </div>
            <!-- Tabela Ativa -->
            <div id="veiculosAtivosContainer"
                 hx:get="@{/cidade/listar}"
                 hx-swap="innerHTML">
                <div th:replace="~{veiculo/tabVeiculosAtivos :: tabVeiculosAtivos}"></div>
            </div>
        </div>
    </main>

</div>

<link rel="stylesheet" th:href="@{/css/cidade.css}">

</body>
</html>
