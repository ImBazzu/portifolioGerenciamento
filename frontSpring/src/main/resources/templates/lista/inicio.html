<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:hx="http://www.w3.org/1999/xhtml">

<head th:replace="~{layout/head :: head('Listas')}"></head>

<body>
<div class="d-flex min-vh-100">
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>

    <main th:replace="~{layout/principal :: principal(~{::conteudo})}">
        <div th:fragment="conteudo" class="app-page lista-page">
            <header class="app-page-header lista-page-header">
                <div>
                    <h1>Listas</h1>
                    <p>Organize listas de transporte, regras de cadastro e atendimento.</p>
                </div>
                <div class="app-page-actions lista-page-actions">
                    <button type="button" class="btn btn-light lista-secondary-action"
                            hx:get="@{/listas/listarArquivadas}"
                            hx-target="#modal"
                            hx-swap="innerHTML">
                        <i class="bi bi-archive me-2"></i>Ver arquivadas
                    </button>
                    <button type="button" class="btn btn-primary lista-primary-action"
                            hx:get="@{/listas/abrirFormulario}"
                            hx-target="#modal"
                            hx-swap="innerHTML">
                        <i class="bi bi-plus-lg me-2"></i>Nova lista
                    </button>
                </div>
            </header>

            <section class="lista-content" aria-label="Listas ativas">
                <div id="listasAtivasContainer"
                     hx:get="@{/listas/listar}"
                     hx-trigger="load"
                     hx-swap="innerHTML">
                    <div class="lista-loading" role="status">
                        <span class="spinner-border spinner-border-sm text-success" aria-hidden="true"></span>
                        <span>Carregando listas...</span>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>
</body>
</html>
