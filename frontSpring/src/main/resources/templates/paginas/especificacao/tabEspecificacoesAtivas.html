<th:block th:fragment="tabEspecificacoesAtivas">
    <div class="card shadow-sm">
        <div class="card-header bg-white py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
            <h5 class="mb-0 fw-bold">Especificações cadastradas</h5>
            <div class="style-search">
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="search" id="inputBuscaEspecificacao" name="nome" th:value="${nome}" class="form-control"
                       aria-label="Buscar especificações"
                       placeholder="Buscar por nome..."
                       hx:get="@{/especificacoes/listar(arquivadas=false)}"
                       hx-trigger="keyup changed delay:300ms, atualizar-especificacoes from:body"
                       hx-target="#especificacoes-lista" hx-swap="innerHTML" hx-preserve="true">
              </div>
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th class="ps-3">Nome</th>
                    <th>Prioridade</th>
                    <th>Observação</th>
                    <th class="text-end pe-3">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(especificacoes)}">
                    <td colspan="4" class="text-center text-muted py-4">Nenhuma especificação encontrada.</td>
                </tr>
                <tr th:each="esp : ${especificacoes}">
                    <td class="ps-3 fw-medium" th:text="${esp.nome}">Nome</td>
                    <td>
                        <span class="badge text-bg-secondary" th:text="${esp.prioridadeNome()}">Prioridade</span>
                    </td>
                    <td>
                        <span th:if="${esp.observacao != null and esp.observacao != ''}" th:text="${#strings.abbreviate(esp.observacao, 50)}">Observação</span>
                        <span th:if="${esp.observacao == null or esp.observacao == ''}" class="text-muted">-</span>
                    </td>
                    <td class="text-end pe-3">
                        <div class="btn-group btn-group-sm" role="group">
                            <button class="btn btn-outline-primary" title="Detalhes"
                                    th:attr="hx-get=@{/especificacoes/{id}/detalhes(id=${esp.id})}"
                                    hx-target="#modal" hx-swap="innerHTML">
                                <i class="bi bi-info-circle me-1"></i> Detalhes
                            </button>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between align-items-center py-2"
             th:if="${totalPaginas > 1}">
            <span class="text-muted small"
                  th:text="'Página ' + (${paginaAtual} + 1) + ' de ' + ${totalPaginas}">Página</span>
            <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-secondary" th:disabled="${paginaAtual == 0}"
                        th:attr="hx-get=@{/especificacoes/listar(nome=${nome},arquivadas=false,pagina=${paginaAtual - 1})}"
                        hx-target="#especificacoes-lista" hx-swap="innerHTML">Anterior</button>
                <button class="btn btn-outline-secondary" th:disabled="${paginaAtual + 1 >= totalPaginas}"
                        th:attr="hx-get=@{/especificacoes/listar(nome=${nome},arquivadas=false,pagina=${paginaAtual + 1})}"
                        hx-target="#especificacoes-lista" hx-swap="innerHTML">Próxima</button>
            </div>
        </div>
    </div>
</th:block>
