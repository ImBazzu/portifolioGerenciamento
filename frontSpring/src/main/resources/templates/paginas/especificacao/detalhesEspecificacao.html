<th:block th:fragment="detalhesEspecificacao">
    <div class="custom-modal-backdrop">
        <div class="custom-modal-card bg-white rounded shadow-lg p-4">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
                <h5 class="fw-bold m-0">Detalhes da Especificação</h5>
                <button th:unless="${arquivado}" class="btn btn-sm btn-light border"
                        hx:get="@{/especificacoes/abrirFormulario/{id}(id=${especificacao.id})}"
                        hx-target="#modal" hx-swap="innerHTML">Editar</button>
                <button th:if="${arquivado}" type="button" class="btn btn-sm btn-outline-secondary"
                        hx:get="@{/especificacoes/listar(arquivadas=true,nome=${nome},pagina=${paginaAtual})}"
                        hx-target="#modal" hx-swap="innerHTML">Voltar</button>
                <button type="button" class="btn-close"
                        hx:get="@{/especificacoes/limpar-modal}" hx-target="#modal" hx-swap="innerHTML"
                        aria-label="Fechar"></button>
            </div>

            <div class="row g-3">
                <div class="col-12">
                    <label class="form-label text-muted small">Nome</label>
                    <p class="fs-6 fw-medium" th:text="${especificacao.nome}">Nome da Especificação</p>
                </div>

                <div class="col-md-6">
                    <label class="form-label text-muted small">Prioridade</label>
                    <p class="fs-6">
                        <span class="badge text-bg-secondary" th:text="${especificacao.prioridadeNome()}">Prioridade</span>
                    </p>
                </div>

                <div class="col-md-6">
                    <label class="form-label text-muted small">Data de Arquivamento</label>
                    <p class="fs-6 fw-medium" th:if="${especificacao.dataArquivado != null}" th:text="${#temporals.format(especificacao.dataArquivado, 'dd/MM/yyyy')}">01/01/2024</p>
                    <p class="fs-6 fw-medium text-muted" th:if="${especificacao.dataArquivado == null}">-</p>
                </div>

                <div class="col-12">
                    <label class="form-label text-muted small">Observação</label>
                    <p class="fs-6 fw-medium" th:if="${especificacao.observacao != null and especificacao.observacao != ''}" th:text="${especificacao.observacao}">Observação</p>
                    <p class="fs-6 fw-medium text-muted" th:if="${especificacao.observacao == null or especificacao.observacao == ''}">-</p>
                </div>
            </div>

            <div th:if="${erroGlobal}" class="alert alert-danger mt-3" role="alert" th:text="${erroGlobal}"></div>
            <div class="border-top pt-3 mt-3 d-flex flex-wrap justify-content-between gap-2">
                <button th:unless="${arquivado}" class="btn btn-outline-warning"
                        hx:patch="@{/especificacoes/{id}/arquivar(id=${especificacao.id})}"
                        hx-confirm="Deseja arquivar esta especificação?" hx-target="#modal" hx-swap="innerHTML">
                    Arquivar
                </button>
                <div th:if="${arquivado}" class="d-flex gap-2">
                    <button class="btn btn-outline-success"
                            hx:patch="@{/especificacoes/{id}/desarquivar(id=${especificacao.id})}"
                            hx-confirm="Deseja desarquivar esta especificação?" hx-target="#modal" hx-swap="innerHTML">
                        Desarquivar
                    </button>
                    <button class="btn btn-outline-danger"
                            hx:delete="@{/especificacoes/{id}(id=${especificacao.id},nome=${nome},pagina=${paginaAtual})}"
                            hx-confirm="Excluir esta especificação definitivamente?" hx-target="#modal" hx-swap="innerHTML">
                        Excluir
                    </button>
                </div>
                <button type="button" class="btn btn-light border"
                        hx:get="@{/especificacoes/limpar-modal}" hx-target="#modal" hx-swap="innerHTML">
                    Fechar
                </button>
            </div>
        </div>
    </div>
</th:block>
