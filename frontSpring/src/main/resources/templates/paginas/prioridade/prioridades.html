<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/head :: head('Prioridades')}"></head>
<body>
<div class="d-flex min-vh-100">
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>
    <main th:replace="~{layout/principal :: principal(~{::conteudo})}">
        <div th:fragment="conteudo" class="app-page">
            <header class="app-page-header">
                <div><h1>Prioridades</h1><p>Defina a busca e a quantidade exata de acompanhantes para novos agendamentos.</p></div>
                <div class="app-page-actions">
                    <button class="btn btn-primary"
                            hx:get="@{/prioridades/abrirFormulario}"
                            hx-target="#modal" hx-swap="innerHTML">
                        <i class="bi bi-plus-lg me-1"></i> Nova Prioridade
                    </button>
                </div>
            </header>
            <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
            <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>
            <div class="card shadow-sm">
                <div class="card-header bg-white"><h2 class="h5 mb-0">Prioridades cadastradas</h2></div>
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light"><tr><th>Nome</th><th>Status</th><th class="text-end">Ações</th></tr></thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(prioridades)}"><td colspan="3" class="text-center text-muted py-4">Nenhuma prioridade cadastrada.</td></tr>
                        <tr th:each="prioridade : ${prioridades}">
                            <td th:text="${prioridade.nome()}">Nome</td>
                            <td th:text="${prioridade.arquivada() ? 'Arquivada' : 'Ativa'}">Ativa</td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-primary"
                                        hx:get="@{/prioridades/{id}/detalhes(id=${prioridade.id()})}"
                                        hx-target="#modal" hx-swap="innerHTML">
                                    <i class="bi bi-info-circle me-1"></i>Detalhes
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
