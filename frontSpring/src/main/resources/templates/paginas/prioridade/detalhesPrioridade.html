<th:block th:fragment="detalhesPrioridade">
    <div class="custom-modal-backdrop">
        <section class="custom-modal-card bg-white rounded shadow-lg p-4"
                 role="dialog" aria-modal="true" aria-labelledby="detalhesPrioridadeTitulo">
            <header class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
                <h2 id="detalhesPrioridadeTitulo" class="h5 fw-bold mb-0">
                    <span th:text="${prioridade.nome()}">Prioridade</span>
                    <span th:if="${prioridade.arquivada()}" class="badge bg-secondary">Arquivada</span>
                </h2>
                <button type="button" class="btn-close" aria-label="Fechar"
                        hx:get="@{/prioridades/limpar-modal}" hx-target="#modal" hx-swap="innerHTML"></button>
            </header>
            <dl class="row">
                <dt class="col-sm-6">Máximo de acompanhantes</dt>
                <dd class="col-sm-6" th:text="${prioridade.quantidadeAcompanhantes()}">0</dd>
            </dl>
            <div th:unless="${prioridade.arquivada()}">
                <button type="button" class="btn btn-sm btn-light border mb-3"
                        data-bs-toggle="collapse" data-bs-target="#editarPrioridade"
                        aria-expanded="false" aria-controls="editarPrioridade">Editar</button>
                <form id="editarPrioridade" class="collapse" th:action="@{/prioridades/{id}(id=${prioridade.id()})}" method="post">
                    <div class="mb-2"><label class="form-label" for="editarNome">Nome</label><input id="editarNome" name="nome" class="form-control" maxlength="100" th:value="${prioridade.nome()}" required></div>
                    <div class="mb-2"><label class="form-label" for="editarAcompanhantes">Máximo de acompanhantes</label><input id="editarAcompanhantes" name="quantidadeAcompanhantes" type="number" min="0" th:value="${prioridade.quantidadeAcompanhantes()}" class="form-control" required></div>
                    <button class="btn btn-primary" type="submit">Salvar</button>
                </form>
            </div>
            <footer class="border-top pt-3 mt-3 d-flex flex-wrap gap-2">
                <form th:unless="${prioridade.arquivada()}" th:action="@{/prioridades/{id}/arquivar(id=${prioridade.id()})}" method="post" onsubmit="return confirm('Deseja arquivar esta prioridade?')">
                    <button class="btn btn-outline-warning" type="submit">Arquivar</button>
                </form>
                <th:block th:if="${prioridade.arquivada()}">
                    <form th:action="@{/prioridades/{id}/desarquivar(id=${prioridade.id()})}" method="post" onsubmit="return confirm('Deseja desarquivar esta prioridade?')">
                        <button class="btn btn-outline-success" type="submit">Desarquivar</button>
                    </form>
                    <form th:action="@{/prioridades/{id}/excluir(id=${prioridade.id()})}" method="post" onsubmit="return confirm('Excluir esta prioridade definitivamente?')">
                        <button class="btn btn-outline-danger" type="submit">Excluir</button>
                    </form>
                    <button type="button" class="btn btn-light border"
                            hx:get="@{/prioridades/listarArquivadas}" hx-target="#modal" hx-swap="innerHTML">
                        Voltar às arquivadas
                    </button>
                </th:block>
                <button type="button" class="btn btn-light border ms-auto"
                        hx:get="@{/prioridades/limpar-modal}" hx-target="#modal" hx-swap="innerHTML">Fechar</button>
            </footer>
        </section>
    </div>
</th:block>
