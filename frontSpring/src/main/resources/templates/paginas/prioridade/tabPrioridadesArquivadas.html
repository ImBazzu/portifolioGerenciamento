<th:block th:fragment="tabPrioridadesArquivadas">
    <div class="custom-modal-backdrop">
        <section class="custom-modal-card bg-white rounded shadow-lg p-4"
                 role="dialog" aria-modal="true" aria-labelledby="prioridadesArquivadasTitulo">
            <header th:replace="~{fragmentos/componentes :: cabecalhoModal('Prioridades arquivadas', 'prioridadesArquivadasTitulo', @{/prioridades/limpar-modal})}"></header>
            <div class="modal-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                        <tr><th>Nome</th><th>Acompanhantes</th><th>Busca na residência</th><th class="text-end">Ações</th></tr>
                        </thead>
                        <tbody>
                        <tr th:if="${#lists.isEmpty(prioridades)}">
                            <td colspan="4" class="text-center text-muted py-4">Nenhuma prioridade arquivada encontrada.</td>
                        </tr>
                        <tr th:each="prioridade : ${prioridades}">
                            <td class="fw-semibold" th:text="${prioridade.nome()}">Nome</td>
                            <td th:text="${prioridade.quantidadeAcompanhantes()}">0</td>
                            <td th:text="${prioridade.buscarNaResidencia() ? 'Sim' : 'Não'}">Não</td>
                            <td class="text-end">
                                <form class="d-inline" th:action="@{/prioridades/{id}/desarquivar(id=${prioridade.id()})}"
                                      method="post" onsubmit="return confirm('Deseja desarquivar esta prioridade?')">
                                    <button type="submit" class="btn btn-sm btn-outline-success">
                                        <i class="bi bi-arrow-counterclockwise me-1"></i> Desarquivar
                                    </button>
                                </form>
                                <button type="button" class="btn btn-sm btn-outline-primary"
                                        hx:get="@{/prioridades/{id}/detalhes(id=${prioridade.id()})}"
                                        hx-target="#modal" hx-swap="innerHTML">
                                    <i class="bi bi-info-circle me-1"></i> Detalhes
                                </button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </div>
</th:block>
