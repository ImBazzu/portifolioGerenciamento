<th:block th:fragment="formPessoa" th:with="edicao=${id != null}">
    <div class="custom-modal-backdrop">
        <section class="custom-modal-card custom-modal-form bg-white rounded shadow-lg p-4"
                 role="dialog" aria-modal="true" aria-labelledby="formPessoaTitulo">
            <header th:replace="~{fragmentos/componentes :: cabecalhoModal(${edicao ? 'Editar Pessoa' : 'Cadastrar Pessoa'}, 'formPessoaTitulo', @{/pessoas/limpar-modal})}"></header>

            <form th:object="${pessoa}"
                  hx:post="${!edicao} ? @{/pessoas(contextoAgendamento=${contextoAgendamento})} : null"
                  hx:put="${edicao} ? @{/pessoas/{id}(id=${id}, contextoAgendamento=${contextoAgendamento})} : null"
                  hx-target="#modal" hx-swap="innerHTML">
                <div class="row g-3">
                    <div class="col-12">
                        <label for="nome" class="form-label fw-bold">Nome</label>
                        <input id="nome" type="text" th:field="*{nome}" class="form-control"
                               th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                               minlength="3" maxlength="59" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}"
                             th:errors="*{nome}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="cpf" class="form-label fw-bold">CPF</label>
                        <input id="cpf" type="text" th:field="*{cpf}" class="form-control"
                               th:classappend="${#fields.hasErrors('cpf')} ? 'is-invalid'"
                               inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('cpf')}"
                             th:errors="*{cpf}"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="telefone" class="form-label fw-bold">Telefone</label>
                        <input id="telefone" type="tel" th:field="*{telefone}" class="form-control"
                               th:classappend="${#fields.hasErrors('telefone')} ? 'is-invalid'"
                               autocomplete="tel" placeholder="(00) 00000-0000" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('telefone')}"
                             th:errors="*{telefone}"></div>
                    </div>
                    <div class="col-12">
                        <label for="endereco" class="form-label fw-bold">Endereço</label>
                        <input id="endereco" type="text" th:field="*{endereco}" class="form-control"
                               th:classappend="${#fields.hasErrors('endereco')} ? 'is-invalid'"
                               maxlength="249" autocomplete="street-address">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('endereco')}"
                             th:errors="*{endereco}"></div>
                    </div>
                    <div class="col-md-6 position-relative js-especificacao-grupo">
                        <label for="especificacaoBusca" class="form-label fw-bold">Especificação</label>
                        <div class="input-group">
                        <input id="especificacaoBusca" type="search" name="termoEspecificacao"
                               class="form-control js-especificacao-busca"
                               th:classappend="${#fields.hasErrors('especificacaoId')} ? 'is-invalid'"
                               placeholder="Digite para buscar uma especificação"
                               autocomplete="off" required
                               th:value="${especificacaoSelecionadaLabel}"
                               hx:get="@{/pessoas/buscar-especificacoes}"
                               hx-trigger="input changed delay:300ms, search"
                               hx-target="#especificacaoResultados"
                               hx-swap="innerHTML"
                               hx-sync="this:replace"
                               aria-controls="especificacaoResultados"
                               aria-autocomplete="list">
                        <button type="button" class="btn btn-outline-secondary" aria-label="Consultar catálogo de especificações"
                                data-abrir-catalogo-especificacoes
                                hx:get="@{/pessoas/catalogo-especificacoes}" hx-target="#catalogoEspecificacaoResultados"
                                hx-include="#catalogoEspecificacaoFiltro" hx-sync="#catalogoEspecificacao:replace"
                                hx-swap="innerHTML">
                            <i class="bi bi-search" aria-hidden="true"></i>
                        </button>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('especificacaoId')}"
                             th:errors="*{especificacaoId}"></div>
                        </div>
                        <input type="hidden" id="especificacaoId" th:field="*{especificacaoId}">
                        <div id="especificacaoResultados"
                             class="list-group position-absolute w-100 shadow rounded-3"
                             style="z-index: 1060; max-height: 18rem; overflow-y: auto;"
                             role="listbox"></div>
                        <div id="especificacaoBuscaMensagem" class="form-text" aria-live="polite">
                            Digite e selecione uma especificação da lista.
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{buscarNaResidencia}">
                            <span class="form-check-label fw-bold">Buscar na residência</span>
                        </label>
                    </div>
                    <div class="col-12">
                        <label for="observacao" class="form-label fw-bold">Observação</label>
                        <textarea id="observacao" th:field="*{observacao}" class="form-control"
                                  th:classappend="${#fields.hasErrors('observacao')} ? 'is-invalid'"
                                  maxlength="249" rows="3"></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('observacao')}"
                             th:errors="*{observacao}"></div>
                    </div>
                </div>

                <dialog id="catalogoEspecificacao" class="catalogo-especificacao" aria-labelledby="catalogoEspecificacaoTitulo">
                    <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
                        <h2 class="h5 fw-bold mb-0" id="catalogoEspecificacaoTitulo">Selecionar especificação</h2>
                        <button type="button" class="btn-close" aria-label="Fechar" data-fechar-catalogo-especificacoes></button>
                    </div>
                    <label class="form-label fw-semibold" for="catalogoEspecificacaoFiltro">Buscar pelo nome</label>
                    <input id="catalogoEspecificacaoFiltro" name="nomeCatalogo" type="search" class="form-control mb-3"
                           placeholder="Digite para filtrar" autocomplete="off"
                           hx:get="@{/pessoas/catalogo-especificacoes}"
                           hx-trigger="input changed delay:300ms, search"
                           hx-target="#catalogoEspecificacaoResultados" hx-swap="innerHTML"
                           hx-sync="#catalogoEspecificacao:replace">
                    <div id="catalogoEspecificacaoResultados" aria-live="polite">
                        <p class="text-muted">Carregando especificações...</p>
                    </div>
                </dialog>

                <div th:if="${erroGlobal != null}" class="alert alert-danger mt-3 mb-0"
                     role="alert" th:text="${erroGlobal}"></div>

                <div class="border-top pt-3 mt-3 d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-light border"
                            hx:get="@{/pessoas/limpar-modal}" hx-target="#modal" hx-swap="innerHTML">
                        Cancelar
                    </button>
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-lg me-1"></i> Salvar Pessoa
                    </button>
                </div>
            </form>
        </section>
    </div>
</th:block>
