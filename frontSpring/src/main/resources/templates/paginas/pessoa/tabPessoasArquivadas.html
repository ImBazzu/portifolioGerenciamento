<th:block th:fragment="tabPessoasArquivadas">
    <div class="custom-modal-backdrop">
      <section class="custom-modal-card bg-white rounded shadow-lg p-4"
               role="dialog" aria-modal="true" aria-labelledby="pessoasArquivadasTitulo">
        <header th:replace="~{fragmentos/componentes :: cabecalhoModal('Pessoas arquivadas', 'pessoasArquivadasTitulo', @{/pessoas/limpar-modal})}"></header>
        <div class="style-search mb-3">
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="search" id="buscaPessoaArquivada" name="nome" th:value="${nome}" class="form-control"
                       aria-label="Buscar pessoas arquivadas"
                       placeholder="Buscar por nome..."
                       hx:get="@{/pessoas/listar(arquivadas=true)}"
                       hx-trigger="keyup changed delay:300ms, atualizar-pessoas from:body"
                       hx-target="#modal" hx-swap="innerHTML" hx-preserve="true">
            </div>
        </div>
        <div class="modal-body p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th class="ps-3">Nome</th>
                    <th>CPF</th>
                    <th>Telefone</th>
                    <th>Especificação</th>
                    <th>Arquivada em</th>
                    <th class="text-end pe-3">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(pessoas)}">
                    <td colspan="6" class="text-center text-muted py-4">Nenhuma pessoa arquivada encontrada.</td>
                </tr>
                <tr th:each="pessoa : ${pessoas}">
                    <td class="ps-3 fw-medium">
                        <span th:text="${pessoa.nome()}">Nome</span>
                        <div class="text-muted small" th:text="${pessoa.endereco()}">Endereço</div>
                    </td>
                    <td th:text="${pessoa.cpf()}">00000000000</td>
                    <td th:text="${pessoa.telefone()}">(00) 00000-0000</td>
                    <td>
                        <span class="badge text-bg-secondary"
                              th:text="${pessoa.especificacaoNome()}">Especificação</span>
                    </td>
                    <td th:text="${#temporals.format(pessoa.dataArquivado(), 'dd/MM/yyyy')}">01/01/2024</td>
                    <td class="text-end pe-3">
                        <button class="btn btn-sm btn-outline-success" title="Restaurar"
                                hx:patch="@{/pessoas/{id}/desarquivar(id=${pessoa.id()})}"
                                hx-confirm="Deseja restaurar esta pessoa?"
                                hx-target="this" hx-swap="none">
                            <i class="bi bi-arrow-counterclockwise"></i> Restaurar
                        </button>
                        <button class="btn btn-sm btn-outline-primary" title="Detalhes"
                                th:attr="hx-get=@{/pessoas/{id}/detalhes/arquivado(id=${pessoa.id()},nome=${nome},pagina=${paginaAtual})}"
                                hx-target="#modal" hx-swap="innerHTML">
                            <i class="bi bi-info-circle me-1"></i> Detalhes
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between align-items-center py-2"
             th:if="${totalPaginas > 1}">
            <span class="text-muted small"
                  th:text="'Página ' + (${paginaAtual} + 1) + ' de ' + ${totalPaginas}">Página</span>
            <div class="btn-group btn-group-sm">
                <button class="btn btn-outline-secondary" th:disabled="${paginaAtual == 0}"
                        th:attr="hx-get=@{/pessoas/listar(nome=${nome},arquivadas=true,pagina=${paginaAtual - 1})}"
                        hx-target="#modal" hx-swap="innerHTML">Anterior</button>
                <button class="btn btn-outline-secondary" th:disabled="${paginaAtual + 1 >= totalPaginas}"
                        th:attr="hx-get=@{/pessoas/listar(nome=${nome},arquivadas=true,pagina=${paginaAtual + 1})}"
                        hx-target="#modal" hx-swap="innerHTML">Próxima</button>
            </div>
        </div>
      </section>
    </div>
</th:block>
