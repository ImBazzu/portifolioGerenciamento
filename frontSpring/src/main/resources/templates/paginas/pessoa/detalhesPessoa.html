<th:block th:fragment="detalhesPessoa" xmlns:hx="http://www.w3.org/1999/xhtml">
    <div class="custom-modal-backdrop">
        <section class="custom-modal-card bg-white rounded shadow-lg p-4"
                 role="dialog" aria-modal="true" aria-labelledby="detalhesPessoaTitulo">
            
            <!-- Header -->
            <header class="d-flex justify-content-between align-items-start border-bottom pb-3 mb-3">
                <div>
                    <h2 class="h5 fw-bold mb-1 d-flex align-items-center" id="detalhesPessoaTitulo">
                        <span th:text="${pessoa.nome}">Pessoa</span>
                        <!-- Badge de Arquivado -->
                        <span th:if="${arquivado}" class="badge bg-secondary ms-2 fs-6">Arquivado</span>
                    </h2>
                    <span class="badge text-bg-light" th:text="${pessoa.prioridade}">MODERADA</span>
                </div>
                
                <div class="d-flex gap-2 align-items-center">
                    <!-- Botão Editar (ajustando para passar o parâmetro arquivado se necessário) -->
                    <button class="btn btn-sm btn-light border"
                            hx:get="@{/pessoas/abrirFormulario/{id}(id=${pessoa.id}, arquivado=${arquivado})}"
                            hx-target="#modal" hx-swap="innerHTML"
                            title="Editar Pessoa">
                        <i class="bi bi-pencil me-1"></i>Editar
                    </button>

                    <!-- Botão Voltar (aparece se estiver arquivado) -->
                    <button th:if="${arquivado}"
                            class="btn btn-sm btn-outline-secondary"
                            hx:get="@{/pessoas/listarArquivados}"
                            hx-target="#modal"
                            hx-swap="innerHTML">
                        <i class="bi bi-arrow-left me-1"></i> Voltar
                    </button>

                    <button type="button" class="btn-close"
                            hx:get="@{/pessoas/limpar-modal}" hx-target="#modal" hx-swap="innerHTML"
                            hx-trigger="fechar-formulario from:body, click"
                            aria-label="Fechar"></button>
                </div>
            </header>

            <!-- Body / Dados -->
            <dl class="row g-3 mb-0">
                <div class="col-12 col-md-6">
                    <dt class="small text-secondary">CPF</dt>
                    <dd th:text="${pessoa.cpf}">CPF</dd>
                </div>
                <div class="col-12 col-md-6">
                    <dt class="small text-secondary">Telefone</dt>
                    <dd th:text="${pessoa.telefone}">Telefone</dd>
                </div>
                <div class="col-12">
                    <dt class="small text-secondary">Endereço</dt>
                    <dd th:text="${pessoa.endereco}">Endereço</dd>
                </div>
                <div class="col-12">
                    <dt class="small text-secondary">Observação</dt>
                    <dd th:text="${#strings.isEmpty(pessoa.observacao) ? 'Nenhuma observação informada.' : pessoa.observacao}">
                        Observação
                    </dd>
                </div>
            </dl>

            <!-- Footer / Ações -->
            <footer class="border-top pt-3 mt-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
                <!-- Se NÃO estiver arquivado, mostra botão de Arquivar -->
                <th:block th:unless="${arquivado}">
                    <button class="btn btn-sm btn-outline-warning"
                            hx:patch="@{/pessoas/{id}/arquivar(id=${pessoa.id})}"
                            hx-confirm="Deseja arquivar esta pessoa?"
                            hx-target="#modal" hx-swap="innerHTML">
                        <i class="bi bi-archive me-1"></i>Arquivar
                    </button>
                </th:block>

                <!-- Se ESTIVER arquivado, pode mostrar opção de desarquivar ou excluir definitivo (igual veículo) -->
                <th:block th:if="${arquivado}">
                    <button class="btn btn-sm btn-outline-success"
                            hx:patch="@{/pessoas/{id}/desarquivar(id=${pessoa.id})}"
                            hx-confirm="Deseja desarquivar esta pessoa?"
                            hx-target="#modal" hx-swap="innerHTML">
                        <i class="bi bi-unarchive me-1"></i>Desarquivar
                    </button>
                </th:block>

                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-sm btn-light border"
                            hx:get="@{/pessoas/limpar-modal}" hx-target="#modal" hx-swap="innerHTML">
                        Fechar
                    </button>
                </div>
            </footer>
        </section>
    </div>
</th:block>
