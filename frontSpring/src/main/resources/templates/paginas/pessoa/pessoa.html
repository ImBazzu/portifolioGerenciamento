<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/head :: head('Pessoas')}"></head>

<body>
<div class="d-flex min-vh-100">
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>

    <main th:replace="~{layout/principal :: principal(~{::conteudo})}">
        <div th:fragment="conteudo" class="container-fluid py-4">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <div>
                    <h2 class="fw-bold mb-1"><i class="bi bi-people text-primary me-2"></i>Gestão de Pessoas</h2>
                    <p class="text-muted small mb-0">Cadastre e gerencie as pessoas atendidas.</p>
                </div>
                <div class="d-flex gap-2">
                    <button class="btn btn-outline-secondary"
                            hx:get="@{/pessoas/listar(arquivadas=true)}"
                            hx-target="#pessoas-lista"
                            hx-swap="innerHTML">
                        <i class="bi bi-archive me-1"></i> Arquivadas
                    </button>
                    <button class="btn btn-primary"
                            hx:get="@{/pessoas/abrirFormulario}"
                            hx-target="#modal"
                            hx-swap="innerHTML">
                        <i class="bi bi-person-plus me-1"></i> Nova Pessoa
                    </button>
                </div>
            </div>

            <div id="pessoas-lista"
                 hx:get="@{/pessoas/listar}"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <div class="text-center text-muted py-5">
                    <span class="spinner-border spinner-border-sm me-2" role="status"></span>
                    Carregando pessoas...
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
