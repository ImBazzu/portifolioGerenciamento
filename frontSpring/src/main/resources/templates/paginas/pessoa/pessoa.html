<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="conteudo">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="h4 mb-0 text-dark fw-bold"><i class="bi bi-person-lines-fill text-primary me-2"></i>Gestão de
                    Pacientes</h2>
                <span class="text-muted small">Cadastro de passageiros e justificativas</span>
            </div>

            <div class="d-flex gap-2">
                <!-- Botão para gerenciar as justificativas/condições da pessoa -->
                <button class="btn btn-outline-secondary shadow-sm" hx-get="/justificativas"
                    hx-target="#conteudo-principal" hx-push-url="true">
                    <i class="bi bi-clipboard2-pulse me-1"></i> Condições Médicas
                </button>
                <button class="btn btn-primary shadow-sm" hx-get="/pessoas/form" hx-target="#modal-form-content"
                    data-bs-toggle="modal" data-bs-target="#modalBasico">
                    <i class="bi bi-person-plus me-1"></i> Novo Paciente
                </button>
            </div>
        </div>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <input type="text" name="nome" class="form-control" placeholder="Buscar paciente por nome..."
                    hx-get="/pessoas/tabela" hx-trigger="keyup delay:500ms changed" hx-target="#tabela-pessoas">
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0 table-responsive" id="tabela-pessoas">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="px-4">Nome</th>
                            <th>CPF</th>
                            <th>Telefone</th>
                            <th>Condição</th>
                            <th class="text-end px-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="pessoa : ${pessoas}">
                            <td class="px-4 fw-medium" th:text="${pessoa.nome}">Nome do Paciente</td>
                            <td th:text="${pessoa.cpf}">000.000.000-00</td>
                            <td th:text="${pessoa.telefone}">(00) 00000-0000</td>
                            <td th:text="${pessoa.condicaoNome}">Fisioterapia</td>
                            <td class="text-end px-4">
                                <button class="btn btn-sm btn-outline-secondary me-1"
                                    th:attr="hx-get=@{/pessoas/form/{id}(id=${pessoa.id})}"
                                    hx-target="#modal-form-content" data-bs-toggle="modal"
                                    data-bs-target="#modalBasico">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-warning"
                                    th:attr="hx-put=@{/pessoas/{id}/arquivar(id=${pessoa.id})}"
                                    hx-confirm="Deseja arquivar este paciente?" hx-target="closest tr"
                                    hx-swap="outerHTML">
                                    <i class="bi bi-archive"></i>
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
