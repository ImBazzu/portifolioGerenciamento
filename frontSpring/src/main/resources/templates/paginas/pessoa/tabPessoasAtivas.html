<th:block th:fragment="tabPessoasAtivas">
    <div class="card shadow-sm">
        <div class="card-header bg-white py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
            <h5 class="mb-0 fw-bold">Pessoas cadastradas</h5>
            <div class="style-search">
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="search" id="inputBuscaPessoa" name="nome" th:value="${nome}" class="form-control"
                       aria-label="Buscar pessoas"
                       placeholder="Buscar por nome..."
                       hx:get="@{/pessoas/listar(arquivadas=false)}"
                       hx-trigger="keyup changed delay:300ms, atualizar-pessoas from:body"
                       hx-include="#filtroEspecificacaoPessoa, #filtroValidacaoPessoa"
                       hx-target="#pessoas-lista" hx-swap="innerHTML" hx-preserve="true">
              </div>
            </div>
            <select id="filtroEspecificacaoPessoa" name="especificacaoId" class="form-select w-auto"
                    aria-label="Filtrar por especificação"
                    hx:get="@{/pessoas/listar(arquivadas=false)}" hx-trigger="change"
                    hx-include="#inputBuscaPessoa, #filtroValidacaoPessoa" hx-target="#pessoas-lista" hx-swap="innerHTML">
                <option value="">Todas as especificações</option>
                <option th:each="especificacao : ${especificacoesFiltro}" th:value="${especificacao.id()}"
                        th:selected="${especificacao.id() == especificacaoId}"
                        th:text="${especificacao.nome() + (especificacao.dataArquivado() == null ? '' : ' (arquivada)')}"></option>
            </select>
            <select id="filtroValidacaoPessoa" name="validada" class="form-select w-auto"
                    aria-label="Filtrar por verificação"
                    hx:get="@{/pessoas/listar(arquivadas=false)}" hx-trigger="change"
                    hx-include="#inputBuscaPessoa, #filtroEspecificacaoPessoa" hx-target="#pessoas-lista" hx-swap="innerHTML">
                <option value="">Todas as pessoas</option>
                <option value="true" th:selected="${validada != null and validada}">Verificadas</option>
                <option value="false" th:selected="${validada != null and !validada}">Não verificadas</option>
            </select>
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th class="ps-3">Nome</th>
                    <th>CPF</th>
                    <th>Telefone</th>
                    <th>Especificação</th>
                    <th>Verificação</th>
                    <th class="text-end pe-3">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(pessoas)}">
                    <td colspan="6" class="text-center text-muted py-4">Nenhuma pessoa encontrada.</td>
                </tr>
                <tr th:each="pessoa : ${pessoas}">
                    <td class="ps-3 fw-medium">
                        <span th:text="${pessoa.nome()}">Nome</span>
                        <div class="text-muted small" th:text="${pessoa.endereco()}">Endereço</div>
                    </td>
                    <td th:text="${pessoa.cpf()}">00000000000</td>
                    <td th:text="${pessoa.telefone()}">(00) 00000-0000</td>
                    <td>
                        <span class="badge text-bg-secondary"
                              th:text="${pessoa.especificacaoNome()}">Especificação</span>
                    </td>
                    <td><span class="badge" th:classappend="${pessoa.validada() ? 'text-bg-success' : 'text-bg-warning'}"
                              th:text="${pessoa.validada() ? 'Verificada' : 'Não verificada'}"></span></td>
                    <td class="text-end pe-3">
                        <button class="btn btn-sm btn-outline-primary" title="Detalhes"
                                th:attr="hx-get=@{/pessoas/{id}/detalhes(id=${pessoa.id()})}"
                                hx-target="#modal" hx-swap="innerHTML">
                            <i class="bi bi-info-circle me-1"></i> Detalhes
                        </button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between align-items-center py-2"
             th:if="${totalPaginas > 1}">
            <span class="text-muted small"
                  th:text="'Página ' + (${paginaAtual} + 1) + ' de ' + ${totalPaginas}">Página</span>
            <div class="btn-group btn-group-sm flex-wrap" role="group" aria-label="Páginas de pessoas">
                <button class="btn btn-outline-secondary" th:disabled="${paginaAtual == 0}"
                        th:attr="hx-get=@{/pessoas/listar(nome=${nome},arquivadas=false,especificacaoId=${especificacaoId},validada=${validada},pagina=${paginaAtual - 1})}"
                        hx-target="#pessoas-lista" hx-swap="innerHTML">Anterior</button>
                <button th:if="${paginaAtual > 2}" class="btn btn-outline-secondary"
                        th:attr="hx-get=@{/pessoas/listar(nome=${nome},arquivadas=false,especificacaoId=${especificacaoId},validada=${validada},pagina=0)}"
                        hx-target="#pessoas-lista" hx-swap="innerHTML">1</button>
                <span th:if="${paginaAtual > 3}" class="btn btn-outline-secondary disabled">…</span>
                <button th:each="i : ${#numbers.sequence(paginaAtual > 2 ? paginaAtual - 2 : 0, paginaAtual + 2 < totalPaginas ? paginaAtual + 2 : totalPaginas - 1)}"
                        class="btn btn-outline-secondary" th:classappend="${i == paginaAtual} ? 'active'"
                        th:attr="hx-get=@{/pessoas/listar(nome=${nome},arquivadas=false,especificacaoId=${especificacaoId},validada=${validada},pagina=${i})}, aria-current=${i == paginaAtual ? 'page' : null}"
                        hx-target="#pessoas-lista" hx-swap="innerHTML" th:text="${i + 1}"></button>
                <span th:if="${paginaAtual + 3 < totalPaginas - 1}" class="btn btn-outline-secondary disabled">…</span>
                <button th:if="${paginaAtual + 3 < totalPaginas}" class="btn btn-outline-secondary"
                        th:attr="hx-get=@{/pessoas/listar(nome=${nome},arquivadas=false,especificacaoId=${especificacaoId},validada=${validada},pagina=${totalPaginas - 1})}"
                        hx-target="#pessoas-lista" hx-swap="innerHTML" th:text="${totalPaginas}"></button>
                <button class="btn btn-outline-secondary" th:disabled="${paginaAtual + 1 >= totalPaginas}"
                        th:attr="hx-get=@{/pessoas/listar(nome=${nome},arquivadas=false,especificacaoId=${especificacaoId},validada=${validada},pagina=${paginaAtual + 1})}"
                        hx-target="#pessoas-lista" hx-swap="innerHTML">Próxima</button>
            </div>
        </div>
    </div>
</th:block>
