<th:block th:fragment="tabCidadesArquivadas" xmlns:hx="http://www.w3.org/1999/xhtml">
    <div class="custom-modal-backdrop">
        <div class="custom-modal-card bg-white rounded shadow-lg p-4">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
                <h5 class="fw-bold m-0"><i class="bi bi-archive me-2"></i>Cidades arquivadas</h5>
                <button type="button" class="btn-close"
                        hx:get="@{/localidade/limpar-modal}"
                        hx-target="#modal" hx-swap="innerHTML"
                        aria-label="Fechar"></button>
            </div>
            <div class="mb-3">
                <div class="style-search">
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="search" id="inputBuscaCidadeArquivada" name="busca"
                               th:value="${busca}" class="form-control"
                               placeholder="Buscar cidade arquivada..."
                               hx:get="@{/localidade/listarArquivado}"
                               hx-trigger="keyup changed delay:300ms, listar-arquivados from:body"
                               hx-target="#modal" hx-swap="innerHTML" hx-preserve="true">
                    </div>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Cidade</th>
                        <th>Estado</th>
                        <th>Tempo de viagem</th>
                        <th>Destinos</th>
                        <th>Data do arquivo</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(cidadesArquivadas)}">
                        <td colspan="6" class="text-center text-muted py-4">Nenhuma cidade arquivada encontrada.</td>
                    </tr>
                    <tr th:each="cidade : ${cidadesArquivadas}" th:attr="data-id=${cidade.id}">
                        <td class="fw-semibold" th:text="${cidade.nome}">Cidade</td>
                        <td th:text="${cidade.estado}">UF</td>
                        <td th:text="${#strings.replace(cidade.tempoViagem, ':', 'h ')} + 'm'">0h 0m</td>
                        <td th:text="${cidade.totalDestinos}">0</td>
                        <td th:text="${cidade.dataArquivamento != null ? #temporals.format(cidade.dataArquivamento, 'dd/MM/yyyy') : '-'}">-</td>
                        <td class="text-end text-nowrap">
                            <button class="btn btn-sm btn-outline-success"
                                    hx:patch="@{/localidade/{id}/desarquivar(id=${cidade.id})}"
                                    hx-swap="none">
                                <i class="bi bi-arrow-counterclockwise me-1"></i> Desarquivar
                            </button>
                            <button class="btn btn-sm btn-outline-primary"
                                    hx:get="@{/localidade/{id}/detalhes(id=${cidade.id}, arquivado=true)}"
                                    hx-target="#modal" hx-swap="innerHTML">
                                <i class="bi bi-info-circle me-1"></i> Detalhes
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="border-top pt-3 mt-3 d-flex justify-content-between align-items-center"
                 th:if="${totalPaginasArquivadas > 1}">
                <span class="text-muted small"
                      th:text="'Página ' + (${paginaAtualArquivadas} + 1) + ' de ' + ${totalPaginasArquivadas}">Página 1 de 1</span>
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${paginaAtualArquivadas == 0} ? 'disabled'">
                        <button class="page-link"
                                hx:get="@{/localidade/listarArquivado(busca=${busca}, pagina=${paginaAtualArquivadas - 1})}"
                                hx-target="#modal" hx-swap="innerHTML">Anterior</button>
                    </li>
                    <li class="page-item" th:classappend="${paginaAtualArquivadas + 1 >= totalPaginasArquivadas} ? 'disabled'">
                        <button class="page-link"
                                hx:get="@{/localidade/listarArquivado(busca=${busca}, pagina=${paginaAtualArquivadas + 1})}"
                                hx-target="#modal" hx-swap="innerHTML">Próxima</button>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</th:block>
