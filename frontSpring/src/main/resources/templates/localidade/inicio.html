<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:hx="http://www.w3.org/1999/xhtml">

<head th:replace="~{layout/head :: head('Localidades')}"></head>

<body>
<div class="d-flex min-vh-100">
    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>

    <main th:replace="~{layout/principal :: principal(~{::conteudo})}">
        <div th:fragment="conteudo" class="app-page">
            <header class="app-page-header">
                <div>
                    <h1>Cidades e destinos</h1>
                    <p>Gerencie as cidades e os destinos disponíveis.</p>
                </div>
                <div class="app-page-actions">
                    <button class="btn btn-outline-secondary"
                            hx:get="@{/localidade/listarArquivado}"
                            hx-target="#modal"
                            hx-swap="innerHTML">
                        <i class="bi bi-archive me-1"></i> Cidades arquivadas
                    </button>
                    <button class="btn btn-primary"
                            hx:get="@{/localidade/abrirFormulario}"
                            hx-target="#modal"
                            hx-swap="innerHTML">
                        <i class="bi bi-plus-lg me-1"></i> Nova cidade
                    </button>
                </div>
            </header>

            <div id="cidadesAtivasContainer"
                 hx:get="@{/localidade/listar}"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <div class="card">
                    <div class="card-body text-center text-muted py-5" role="status">
                        <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
                        Carregando cidades...
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

</body>
</html>
