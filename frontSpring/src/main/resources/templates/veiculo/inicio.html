<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:hx="http://www.w3.org/1999/xhtml">

<head th:replace="~{layout/head :: head('Veículos')}"></head>

<body>

<div class="d-flex min-vh-100">

    <aside th:replace="~{layout/sidebar :: sidebar}"></aside>

    <main th:replace="~{layout/principal :: principal(~{::conteudo})}">
        <div th:fragment="conteudo" class="app-page">
            <header class="app-page-header">
                <div>
                    <h1>Tipos de veículos</h1>
                    <p>Gerencie os veículos disponíveis para o transporte.</p>
                </div>
                <div class="app-page-actions">
                    <button class="btn btn-outline-secondary"
                            hx:get="@{/veiculo/listarArquivado}"
                            hx-target="#modal"
                            hx-swap="innerHTML">
                        <i class="bi bi-archive me-1"></i> Arquivados
                    </button>

                    <button class="btn btn-primary"
                            hx:get="@{/veiculo/abrirFormulario}"
                            hx-target="#modal"
                            hx-swap="innerHTML">
                        <i class="bi bi-plus-lg me-1"></i> Novo Veículo
                    </button>
                </div>
            </header>

            <div id="veiculosAtivosContainer"
                 hx:get="@{/veiculo/listar}"
                 hx-swap="innerHTML">
                <div th:replace="~{veiculo/tabVeiculosAtivos :: tabVeiculosAtivos}"></div>
            </div>
        </div>
    </main>

</div>

</body>
</html>
