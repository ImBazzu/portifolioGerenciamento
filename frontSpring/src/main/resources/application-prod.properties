# Salve como frontSpring/src/main/resources/application-prod.properties
# Ativado por SPRING_PROFILES_ACTIVE=prod (já definido no docker-compose.yml).
# Estas chaves sobrescrevem as do application.properties.
 
# Porta interna: o Caddy fala com o container em 8080 (só o Caddy é público)
server.port=8080
 
# TLS termina no Caddy: respeitar X-Forwarded-Proto / X-Forwarded-For.
# "native" só confia em proxies internos (redes privadas/Docker).
server.forward-headers-strategy=native
 
# Cookie de sessão só trafega por HTTPS
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
 
# Produção: cache de templates ligado
spring.thymeleaf.cache=true
 
# Sobras do WebClient (o BFF usa RestClient): não deixe TRACE/DEBUG em produção
logging.level.reactor.netty.http.client=WARN
logging.level.org.springframework.web.reactive.function.client=WARN