spring.application.name=frontSpring

server.port=80

spring.mvc.hiddenmethod.filter.enabled=true

api.base-url=${API_BASE_URL:http://localhost:8080/api}

# Thymeleaf
spring.thymeleaf.cache=true

spring.web.error.whitelabel.enabled=false

# Logs HTTP
logging.level.reactor.netty.http.client=WARN
logging.level.org.springframework.web.reactive.function.client=WARN